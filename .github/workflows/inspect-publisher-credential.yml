name: inspect-publisher-credential
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: b4-publisher-credential-inspect
  cancel-in-progress: false
jobs:
  inspect:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # No Environment: same Secret resolution as the real consumer job.
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
          submodules: false
      - name: Prepare parser before exposing the publisher credential
        run: |
          python3 -m venv "$RUNNER_TEMP/b4-python"
          "$RUNNER_TEMP/b4-python/bin/pip" install --only-binary=:all: 'PyYAML==6.0.3'
      - name: Authenticate the resolved publisher and inspect authorization
        env:
          PUBLISHER_KUBECONFIG_B64: ${{ secrets.PUBLISHER_KUBECONFIG_B64 }}
          GH_TOKEN: ${{ github.token }}
          B4_WORKFLOW_SHA: ${{ github.workflow_sha }}
        run: |
          set -euo pipefail
          umask 077
          result=0
          "$RUNNER_TEMP/b4-python/bin/python" scripts/actions/inspect_publisher.py > "$RUNNER_TEMP/publisher-credential-report.json" || result=$?
          cat "$RUNNER_TEMP/publisher-credential-report.json"
          exit "$result"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: publisher-credential-report-${{ github.run_attempt }}
          path: ${{ runner.temp }}/publisher-credential-report.json
          if-no-files-found: ignore
          retention-days: 30
