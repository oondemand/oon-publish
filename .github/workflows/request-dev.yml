name: request-central-dev

on:
  workflow_call:
    inputs:
      activation_api_url:
        description: Endpoint explícito da Central; se omitido, usa OON_ACTIVATION_API_URL ou o endpoint SaaS
        required: false
        type: string
        default: ""
    outputs:
      release_id:
        description: Release autorizada pela Central de Ativações
        value: ${{ jobs.request.outputs.release_id }}

permissions:
  contents: read
  id-token: write

concurrency:
  group: oon-request-dev-${{ github.repository }}-${{ github.sha }}
  cancel-in-progress: false

jobs:
  request:
    name: Solicitar publicação em Dev
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      id-token: write
    outputs:
      release_id: ${{ steps.request.outputs.release_id }}

    steps:
      - name: Checkout da Central chamadora
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          submodules: false
          show-progress: false

      - name: Validar contrato de publicação
        id: manifest
        shell: bash
        run: |
          set -euo pipefail

          test -f oon.deploy.json || {
            echo "oon.deploy.json não encontrado na raiz do repositório." >&2
            exit 1
          }

          app_code="$(jq -er '.appCode | strings | select(length > 0)' oon.deploy.json)"
          schema_version="$(jq -er '.schemaVersion | strings | select(length > 0)' oon.deploy.json)"

          [[ "$app_code" =~ ^[a-z0-9][a-z0-9-]{0,49}$ ]] || {
            echo "appCode inválido no oon.deploy.json: $app_code" >&2
            exit 1
          }

          architecture='{}'
          capabilities="$(jq -ce '.capabilities // {} | if type == "object" then . else error("capabilities deve ser um objeto") end' oon.deploy.json)"
          functional_capabilities='{}'
          if [[ -f central.app.json ]]; then
            architecture="$(jq -ce '{
              tenancyModel,
              availability,
              accessMode,
              authorizationMode,
              deploymentMode
            } | with_entries(select(.value != null and .value != ""))' central.app.json)"

            jq -e '.schemaVersion == 1 and (.capabilities | type == "array") and ((.capabilitySettings // {}) | type == "object")' central.app.json >/dev/null || {
              echo "central.app.json inválido: schemaVersion, capabilities ou capabilitySettings." >&2
              exit 1
            }
            if jq -e '.capabilities | index("core.transactional-email") != null' central.app.json >/dev/null; then
              jq -e '
                .capabilitySettings["core.transactional-email"] as $email |
                ($email.enabled == true) and
                ($email.scopePolicy | IN("app_only", "tenant_required", "tenant_override")) and
                ($email.templates | type == "array" and length > 0) and
                ([$email.templates[] |
                  (.code | strings | test("^[a-z0-9][a-z0-9-]{0,49}$")) and
                  (.definition | strings | test("^(?!/)(?!.*\\.\\.)[^[:cntrl:]]+\\.json$"))
                ] | all)
              ' central.app.json >/dev/null || {
                echo "Declaração de core.transactional-email inválida no central.app.json." >&2
                exit 1
              }
              functional_capabilities="$(jq -ce '{"core.transactional-email": .capabilitySettings["core.transactional-email"]}' central.app.json)"
            fi
          fi

          jq -e '
            if .tenancyModel == "none" then
              .availability == "common" and
               .accessMode == "authenticated_users" and
              .authorizationMode == "rbac" and
              .deploymentMode == "singleton"
            elif .accessMode == "authenticated_users" or .deploymentMode == "singleton" then
              false
            else
              true
            end
          ' <<<"$architecture" >/dev/null || {
            echo "Arquitetura tenantless inválida: use none/common/authenticated_users/rbac/singleton." >&2
            exit 1
          }

          jq -e 'has("core.transactional-email") | not' <<<"$capabilities" >/dev/null || {
            echo "core.transactional-email é funcional e deve existir apenas no central.app.json." >&2
            exit 1
          }

          echo "app_code=$app_code" >> "$GITHUB_OUTPUT"
          echo "schema_version=$schema_version" >> "$GITHUB_OUTPUT"
          echo "architecture=$architecture" >> "$GITHUB_OUTPUT"
          echo "capabilities=$capabilities" >> "$GITHUB_OUTPUT"
          echo "functional_capabilities=$functional_capabilities" >> "$GITHUB_OUTPUT"

      - name: Resolver endpoint canônico da Central
        id: endpoint
        shell: bash
        env:
          INPUT_ACTIVATION_API_URL: ${{ inputs.activation_api_url }}
          ORGANIZATION_ACTIVATION_API_URL: ${{ vars.OON_ACTIVATION_API_URL }}
          DEFAULT_ACTIVATION_API_URL: https://central-ativacao.oonapps.online/api
        run: |
          set -euo pipefail

          configured="${INPUT_ACTIVATION_API_URL:-${ORGANIZATION_ACTIVATION_API_URL:-$DEFAULT_ACTIVATION_API_URL}}"
          normalized="$(python3 - "$configured" <<'PY'
          import sys
          from urllib.parse import urlsplit, urlunsplit

          raw = sys.argv[1].strip()
          parsed = urlsplit(raw)
          allowed_hosts = {"central-ativacao.oonapps.online"}
          if parsed.scheme != "https":
              raise SystemExit("OON_ACTIVATION_API_URL deve usar HTTPS.")
          if parsed.hostname not in allowed_hosts:
              raise SystemExit("OON_ACTIVATION_API_URL aponta para hostname não autorizado.")
          if parsed.username or parsed.password or parsed.query or parsed.fragment:
              raise SystemExit("OON_ACTIVATION_API_URL não pode conter credenciais, query ou fragment.")
          if parsed.port not in (None, 443):
              raise SystemExit("OON_ACTIVATION_API_URL deve usar a porta HTTPS padrão.")
          if parsed.path.rstrip("/") != "/api":
              raise SystemExit("OON_ACTIVATION_API_URL deve terminar em /api.")
          print(urlunsplit(("https", parsed.hostname, "/api", "", "")))
          PY
          )"

          echo "activation_api_url=$normalized" >> "$GITHUB_OUTPUT"
          {
            echo "## Endpoint de delivery"
            echo
            printf -- '- Central: `%s`\n' "$normalized"
            if [[ -n "${INPUT_ACTIVATION_API_URL:-}" ]]; then
              printf -- '- Origem: `workflow input`\n'
            elif [[ -n "${ORGANIZATION_ACTIVATION_API_URL:-}" ]]; then
              printf -- '- Origem: `organization variable`\n'
            else
              printf -- '- Origem: `SaaS default`\n'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Solicitar autorização à Central de Ativações
        id: request
        shell: bash
        env:
          APP_CODE: ${{ steps.manifest.outputs.app_code }}
          APP_ARCHITECTURE: ${{ steps.manifest.outputs.architecture }}
          APP_CAPABILITIES: ${{ steps.manifest.outputs.capabilities }}
          APP_FUNCTIONAL_CAPABILITIES: ${{ steps.manifest.outputs.functional_capabilities }}
          ACTIVATION_API_URL: ${{ steps.endpoint.outputs.activation_api_url }}
        run: |
          set -euo pipefail

          audience_encoded="$(python3 -c 'import sys, urllib.parse; print(urllib.parse.quote(sys.argv[1], safe=""))' "$ACTIVATION_API_URL")"
          oidc_response="$RUNNER_TEMP/oon-oidc.json"
          api_response="$RUNNER_TEMP/oon-publication.json"
          api_headers="$RUNNER_TEMP/oon-publication.headers"

          curl --fail --silent --show-error \
            --header "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=${audience_encoded}" \
            --output "$oidc_response"

          oidc_token="$(jq -er '.value | strings | select(length > 0)' "$oidc_response")"
          echo "::add-mask::$oidc_token"

          payload="$(jq -nc --arg appCode "$APP_CODE" --argjson architecture "$APP_ARCHITECTURE" --argjson capabilities "$APP_CAPABILITIES" --argjson functionalCapabilities "$APP_FUNCTIONAL_CAPABILITIES" '{appCode: $appCode, architecture: $architecture, capabilities: $capabilities, functionalCapabilities: $functionalCapabilities, artifactContractVersion: 1}')"
          status="$({ curl --silent --show-error \
            --connect-timeout 10 \
            --max-time 45 \
            --dump-header "$api_headers" \
            --output "$api_response" \
            --write-out '%{http_code}' \
            --request POST \
            --header "Authorization: Bearer $oidc_token" \
            --header 'Content-Type: application/json' \
            --data "$payload" \
            "$ACTIVATION_API_URL/integracao/publicacoes/solicitar"; } || true)"

          if [[ ! "$status" =~ ^2[0-9][0-9]$ ]]; then
            message="$(jq -r '.error.message // .message // "Falha não detalhada pela API."' "$api_response" 2>/dev/null || true)"
            code="$(jq -r '.error.code // .code // "UNKNOWN_ERROR"' "$api_response" 2>/dev/null || echo UNKNOWN_ERROR)"
            phase="$(jq -r '.error.details.phase // .details.phase // .phase // "não informada"' "$api_response" 2>/dev/null || echo "não informada")"
            upstream_status="$(jq -r '.error.details.upstreamStatus // .details.upstreamStatus // empty' "$api_response" 2>/dev/null || true)"
            request_id="$(jq -r '.error.details.requestId // .details.requestId // .requestId // empty' "$api_response" 2>/dev/null || true)"

            message="$(printf '%s' "${message:-Falha não detalhada pela API.}" | tr '\r\n' '  ' | cut -c1-500)"
            code="$(printf '%s' "${code:-UNKNOWN_ERROR}" | tr -cd '[:alnum:]_.-')"
            phase="$(printf '%s' "${phase:-não informada}" | tr '\r\n' '  ' | cut -c1-120)"
            upstream_status="$(printf '%s' "$upstream_status" | tr -cd '[:alnum:]_.-')"
            request_id="$(printf '%s' "$request_id" | tr -cd '[:alnum:]_.:-')"
            if [[ -z "$request_id" && -s "$api_headers" ]]; then
              request_id="$(awk 'BEGIN{IGNORECASE=1} /^x-request-id:/{gsub("\r", "", $2); print $2; exit}' "$api_headers")"
              request_id="$(printf '%s' "$request_id" | tr -cd '[:alnum:]_.:-')"
            fi

            diagnostic="HTTP ${status:-sem resposta} | código: $code | fase: $phase"
            [[ -n "$upstream_status" ]] && diagnostic="$diagnostic | upstream: $upstream_status"
            [[ -n "$request_id" ]] && diagnostic="$diagnostic | requestId: $request_id"

            echo "::error title=Publicação rejeitada::$diagnostic — $message"
            echo "Solicitação rejeitada pela Central de Ativações: $diagnostic — $message" >&2
            {
              echo "## Falha ao solicitar publicação em Dev"
              echo
              echo "- App: \`$APP_CODE\`"
              echo "- Repositório: \`$GITHUB_REPOSITORY\`"
              echo "- Commit: \`$GITHUB_SHA\`"
              echo "- HTTP: \`${status:-sem resposta}\`"
              echo "- Código: \`$code\`"
              echo "- Fase: \`$phase\`"
              [[ -n "$upstream_status" ]] && echo "- Status upstream: \`$upstream_status\`"
              [[ -n "$request_id" ]] && echo "- Request ID: \`$request_id\`"
              echo "- Mensagem: $message"
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          release_id="$(jq -er '.releaseId | strings | select(length > 0)' "$api_response")"
          stage="$(jq -r '.etapa // "autorizada"' "$api_response")"
          idempotent="$(jq -r '.idempotente // false' "$api_response")"
          retried="$(jq -r '.reprocessada // false' "$api_response")"
          restoration="$(jq -r '.restauracao // false' "$api_response")"
          archived="$(jq -r '.arquivada // false' "$api_response")"

          if [[ "$archived" == "true" || "$stage" =~ ^(exclusao_solicitada|aguardando_publicacoes|limpando_infraestrutura|excluindo|falha_limpeza|excluida)$ ]]; then
            message="A Central devolveu uma release arquivada ou pertencente ao ciclo de limpeza."
            echo "::error title=Publicação Dev inconsistente::release=$release_id | etapa=$stage | arquivada=$archived"
            echo "$message release=$release_id etapa=$stage arquivada=$archived" >&2
            {
              echo "## Falha ao solicitar publicação em Dev"
              echo
              echo "- App: $APP_CODE"
              echo "- Release: $release_id"
              echo "- Etapa: $stage"
              echo "- Arquivada: $archived"
              echo "- Motivo: $message"
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          if [[ "$stage" == falha_* || "$stage" == "cancelada" ]]; then
            message="$(jq -r '.error.message // .message // "A release permaneceu em estado de falha."' "$api_response" 2>/dev/null || true)"
            echo "A Central de Ativações devolveu HTTP $status, mas a release $release_id está em '$stage': $message" >&2
            exit 1
          fi

          echo "release_id=$release_id" >> "$GITHUB_OUTPUT"
          echo "Publicação Dev aceita: release=$release_id etapa=$stage idempotente=$idempotent reprocessada=$retried restauracao=$restoration arquivada=$archived"

          {
            echo "## Publicação Dev solicitada"
            echo
            echo "- App: \`$APP_CODE\`"
            echo "- Release: \`$release_id\`"
            echo "- Etapa: \`$stage\`"
            echo "- Idempotente: $idempotent"
            echo "- Reprocessada: $retried"
            echo "- Restauração: $restoration"
            echo "- Arquivada: $archived"
            echo "- Repositório: \`$GITHUB_REPOSITORY\`"
            echo "- Commit: \`$GITHUB_SHA\`"
            echo "- Capabilities: \`$(jq -c 'keys' <<<"$APP_CAPABILITIES")\`"
            echo "- Capabilities funcionais: \`$(jq -c 'keys' <<<"$APP_FUNCTIONAL_CAPABILITIES")\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Remover respostas temporárias
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/oon-oidc.json" "$RUNNER_TEMP/oon-publication.json" "$RUNNER_TEMP/oon-publication.headers"
