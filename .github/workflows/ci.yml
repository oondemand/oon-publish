name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Validar contratos do endpoint greenfield
        run: bash test/contracts.sh
      - name: Validar seleção de instância sem acesso externo
        run: python3 test/instance-selection.py
