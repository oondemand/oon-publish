name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Validar contratos do endpoint greenfield
        run: bash test/contracts.sh

      - name: Validar declaração funcional de segredos
        run: python3 test/secrets-contract.py
